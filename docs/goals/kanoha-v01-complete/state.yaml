version: 2

goal:
  title: "かのはアプリ v0.1 完成(設計レビュー指摘の改善)"
  slug: "kanoha-v01-complete"
  kind: existing_plan
  tranche: "継続実行: W1〜W7 の縦切りパッケージを順に実装・検証し、実環境で v0.1 ループが1周するまで止まらない"
  status: active
  intake:
    original_request: "設計の指摘を改善してアプリを最後まで作成するゴールを設定して"
    interpreted_outcome: "レビュー指摘 A1〜A5/B1〜B15 を解消し、doc.md §24 の v0.1 ループが実 Supabase/Gemini/Slack で1周する状態にする"
    input_shape: existing_plan
    audience: "開発者本人(親)と小2の子ども"
    authority: approved
    proof_type: demo
    completion_proof: "typecheck/lint/test/build 全緑 + E2E(答え非表示・子どもロック・4/5判定)緑 + 実環境で v0.1 ループ1周の実ログ(review_schedule/weakness_map/parent_reports の行と Slack 受信)"
    likely_misfire: "テストが緑でもテスト済みロジックが本番から未参照のまま残る(B2/B3 の再発)。個別修正に終始し attempts→weakness→review→report の結線を通さない"
    blind_spots_considered:
      - ".env 不在。実環境工程はユーザーのキー提供までブロック"
      - "親PIN は users への新カラム+マイグレーション+RLS テストが必要"
      - "段階開示のサーバー化で LearningFlow の状態管理と E2E を作り直す"
      - "JST 統一は既存の日付解釈を変える(既存データは無いので許容)"
      - "rateLimit を DB 化すると RLS 対象テーブルが増える"
    existing_plan_facts:
      - "A1: モードcookie + 親PIN(4桁ハッシュを users に保存)、proxy.ts で /parent/* をリダイレクト、子ども画面から親画面リンク撤去"
      - "A2: サーバー側段階開示。POST /api/problems/[id]/hint {level}。hint_level_used をサーバー記録。類題選択肢もサーバー生成"
      - "A3: Asia/Tokyo を全体の基準日にする共通ヘルパ"
      - "A4: mistakeType の正は lib/curriculum/mistakeTypes.ts(13種)。Zod/DB CHECK/doc.md を揃え、attempts へ伝搬"
      - "A5: 単元の正は lib/curriculum/grade2Math.ts。lib/ai/index.ts の重複リスト廃止、Zod enum + DB CHECK"
      - "B1〜B15 は goal.md の欠陥リスト参照(file:line 付き)"
      - "パッケージ順序: W1→W2→[Judge]→W3→[Judge]→W4→W5→W6→W7→[最終監査]"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/kanoha-v01-complete/"
    command: "npx goalbuddy board docs/goals/kanoha-v01-complete"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

