<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="なかまわけと せいり">
  <!-- 背景カード -->
  <rect width="400" height="300" rx="24" fill="#f0fdfa"/>
  
  <!-- タイトル -->
  <text x="200" y="40" text-anchor="middle" font-size="24" font-family="sans-serif" font-weight="900" fill="#134e4a">なかまわけと せいり</text>
  
  <!-- 左エリア: なかまわけ（グループわけ） -->
  <g transform="translate(25, 60)">
    <!-- 丸グループ -->
    <rect x="0" y="0" width="165" height="65" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2.5"/>
    <circle cx="28" cy="32" r="16" fill="#f43f5e"/>
    <text x="56" y="38" font-size="16" font-family="sans-serif" font-weight="800" fill="#134e4a">● まる</text>
    <text x="145" y="38" text-anchor="end" font-size="16" font-family="sans-serif" font-weight="900" fill="#f43f5e">4こ</text>
    
    <!-- 四角グループ -->
    <rect x="0" y="75" width="165" height="65" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2.5"/>
    <rect x="14" y="18" width="28" height="28" rx="6" fill="#0284c7"/>
    <text x="56" y="113" font-size="16" font-family="sans-serif" font-weight="800" fill="#134e4a">■ しかく</text>
    <text x="145" y="113" text-anchor="end" font-size="16" font-family="sans-serif" font-weight="900" fill="#0284c7">3こ</text>

    <!-- 三角グループ -->
    <rect x="0" y="150" width="165" height="65" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2.5"/>
    <polygon points="28,168 12,198 44,198" fill="#eab308"/>
    <text x="56" y="188" font-size="16" font-family="sans-serif" font-weight="800" fill="#134e4a">▲ さんかく</text>
    <text x="145" y="188" text-anchor="end" font-size="16" font-family="sans-serif" font-weight="900" fill="#ca8a04">2こ</text>
  </g>

  <!-- 右エリア: 整理したひょう（まとめ表） -->
  <g transform="translate(205, 60)">
    <rect x="0" y="0" width="170" height="215" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(13,148,136,0.1))"/>
    
    <!-- 表ヘッダー -->
    <rect x="0" y="0" width="170" height="42" rx="14" fill="#0d9488"/>
    <text x="45" y="27" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="800" fill="#ffffff">かたち</text>
    <line x1="85" y1="0" x2="85" y2="215" stroke="#ccfbf1" stroke-width="2"/>
    <text x="128" y="27" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="800" fill="#ffffff">かず</text>

    <!-- 行1: まる -->
    <line x1="0" y1="42" x2="170" y2="42" stroke="#ccfbf1" stroke-width="2"/>
    <circle cx="45" cy="65" r="10" fill="#f43f5e"/>
    <text x="128" y="70" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="900" fill="#134e4a">4</text>

    <!-- 行2: しかく -->
    <line x1="0" y1="88" x2="170" y2="88" stroke="#ccfbf1" stroke-width="2"/>
    <rect x="36" y="102" width="18" height="18" rx="4" fill="#0284c7"/>
    <text x="128" y="116" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="900" fill="#134e4a">3</text>

    <!-- 行3: さんかく -->
    <line x1="0" y1="134" x2="170" y2="134" stroke="#ccfbf1" stroke-width="2"/>
    <polygon points="45,148 35,166 55,166" fill="#eab308"/>
    <text x="128" y="162" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="900" fill="#134e4a">2</text>

    <!-- 合計フッター -->
    <line x1="0" y1="178" x2="170" y2="178" stroke="#0d9488" stroke-width="2.5"/>
    <rect x="0" y="178" width="170" height="37" rx="14" fill="#f0fdfa"/>
    <text x="45" y="202" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="900" fill="#0f766e">ぜんぶ</text>
    <text x="128" y="202" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="900" fill="#0f766e">9こ</text>
  </g>
</svg>
