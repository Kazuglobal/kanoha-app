<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="なかまわけして かぞえよう">
  <rect width="400" height="300" rx="24" fill="#f0fdfa"/>
  <text x="200" y="38" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="900" fill="#134e4a">なかまわけして かぞえよう</text>

  <!-- 左: ばらばらの カード -->
  <rect x="20" y="58" width="175" height="190" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="2.5"/>
  <g fill="#f43f5e">
    <circle cx="50" cy="90" r="15"/><circle cx="150" cy="105" r="15"/>
    <circle cx="80" cy="185" r="15"/><circle cx="165" cy="215" r="15"/>
  </g>
  <g fill="#0284c7">
    <rect x="90" y="76" width="28" height="28" rx="5"/><rect x="34" y="140" width="28" height="28" rx="5"/>
    <rect x="120" y="160" width="28" height="28" rx="5"/>
  </g>
  <g fill="#eab308">
    <polygon points="105,125 89,153 121,153"/><polygon points="45,203 29,231 61,231"/>
  </g>

  <!-- 右: せいりする ひょう(かずは じぶんで かぞえる) -->
  <g transform="translate(210, 58)">
    <rect x="0" y="0" width="170" height="190" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
    <path d="M0 16a16 16 0 0 1 16-16h138a16 16 0 0 1 16 16v26H0Z" fill="#0d9488"/>
    <text x="45" y="27" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="800" fill="#ffffff">かたち</text>
    <text x="128" y="27" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="800" fill="#ffffff">かず</text>
    <line x1="85" y1="42" x2="85" y2="190" stroke="#ccfbf1" stroke-width="2"/>
    <line x1="0" y1="79" x2="170" y2="79" stroke="#ccfbf1" stroke-width="2"/>
    <line x1="0" y1="116" x2="170" y2="116" stroke="#ccfbf1" stroke-width="2"/>
    <line x1="0" y1="153" x2="170" y2="153" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="45" cy="61" r="11" fill="#f43f5e"/>
    <rect x="35" y="88" width="20" height="20" rx="4" fill="#0284c7"/>
    <polygon points="45,124 34,145 56,145" fill="#eab308"/>
    <g font-size="20" font-family="sans-serif" font-weight="900" fill="#0d9488" text-anchor="middle">
      <text x="128" y="68">?</text><text x="128" y="105">?</text><text x="128" y="142">?</text>
    </g>
    <text x="45" y="178" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="900" fill="#0f766e">ぜんぶ</text>
    <text x="128" y="179" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="900" fill="#0d9488">?</text>
  </g>

  <text x="200" y="278" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#134e4a">おなじ かたちに しるしを つけながら かぞえよう</text>
</svg>
